name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      # test + build. Échoue la PR si l'un des deux casse.
      - run: npm run check

      # Lint informatif : ~3700 erreurs préexistantes (dette de stabilisation),
      # ne bloque pas la PR tant que la config ESLint n'est pas calibrée pour R3F.
      - run: npm run lint
        continue-on-error: true
